name: Android CI — Winter Forest

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Unit Tests, Debug APK, Release APK & Release AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests, debug APK, release APK & release AAB
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
        run: |
          if [ -f scripts/ci-build-and-verify.sh ]; then
            bash scripts/ci-build-and-verify.sh
          else
            export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/upload-keystore.jks"
              export KEYSTORE_PATH="${GITHUB_WORKSPACE}/upload-keystore.jks"
            fi
            chmod +x gradlew
            ./gradlew test assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon
            rm -f "${GITHUB_WORKSPACE}/upload-keystore.jks"
          fi

      - name: Upload APK, AAB, Merged Manifest & JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-forest-release-and-debug-outputs
          path: |
            app-winterforest/build/outputs/apk/debug/*.apk
            app-winterforest/build/outputs/apk/release/*.apk
            app-winterforest/build/outputs/bundle/release/*.aab
            app-winterforest/build/intermediates/merged_manifests/**/AndroidManifest.xml
            app-winterforest/build/reports/tests/**
