name: Android CI — Winter Forest

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Unit Tests, Debug APK, Release APK & Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore from CI secret (if configured by repository owner)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/upload-keystore.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret configured yet; building unsigned release artifacts."
          fi

      - name: Run unit tests (./gradlew test)
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK (./gradlew assembleDebug)
        env:
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release APK (./gradlew assembleRelease)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Bundle Release AAB (./gradlew bundleRelease)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove temporary decoded keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/upload-keystore.jks"

      - name: Upload APK, AAB, Merged Manifest & JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-forest-release-and-debug-outputs
          path: |
            app-winterforest/build/outputs/apk/debug/*.apk
            app-winterforest/build/outputs/apk/release/*.apk
            app-winterforest/build/outputs/bundle/release/*.aab
            app-winterforest/build/intermediates/merged_manifests/**/AndroidManifest.xml
            app-winterforest/build/reports/tests/**
